
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Table</title>
    <link rel="stylesheet" href="../styles/adminPage.css">
    <link rel="icon" type="image/x-icon" href="../assests/icon/favicon.svg">
     <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body>


    <div class="container">

        <!--  <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
        <iconify-icon icon="mdi:menu" width="30" height="30"></iconify-icon>
        </button> -->

        <section class="icons-container">
            <span>
            <img src="../assests/icon/favicon.svg" alt="Restaurant logo">
            </span>
            <iconify-icon icon="ion:home" width="24" height="24" style = "color:#EA6D27 ;"></iconify-icon>
            <iconify-icon icon="mage:dots-menu" width="24" height="24"></iconify-icon>
            <iconify-icon icon="material-symbols-light:list-alt-rounded" width="24" height="24"></iconify-icon>
            <iconify-icon icon="streamline:burger-solid" width="24" height="24"></iconify-icon>
           <iconify-icon icon="ix:alarm-bell-filled" width="24" height="24"></iconify-icon>
            <iconify-icon icon="bitcoin-icons:contacts-filled" width="24" height="24"></iconify-icon>
            <iconify-icon icon="famicons:send-sharp" width="24" height="24"></iconify-icon>
            <iconify-icon icon="weui:setting-filled" width="24" height="24"></iconify-icon>
        </section>

         <div class="admin-container">
      <div class="addproduct-container">
        <h2>Product Management</h2>
        <button id="add-product-btn">+ Add Product</button>
      </div>

      <div class="admin-table">
        <table class="product-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Status</th>
              <th>ID</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-table-body">
            <!-- Rows injected by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="message hidden">

  </div>

    </div>
    
    <script src="../script/adminPage.js"></script>
</body>
</html>
